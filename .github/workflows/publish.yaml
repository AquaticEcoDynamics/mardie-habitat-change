name: Render and Deploy Quarto Site

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Renders the site locally on the runner
      - name: Render Quarto Project
        id: render
        uses: quarto-dev/quarto-actions/render@v2

      # ONLY ONE upload step here!
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs # change to '_site' if _quarto.yml specifies output-dir: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Password-protected copy on SEAF (Azure Static Web App mardie-docs,
      # https://mardie.seaf.org.au). Runs whenever the render succeeded, so a
      # Pages failure doesn't block it and vice versa.
      - name: Prune unreferenced files for Static Web Apps
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        run: python3 .github/scripts/prune_unreferenced.py docs _swa

      - name: Deploy to Azure Static Web Apps (SEAF)
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "_swa"
          api_location: ""
          output_location: ""
          skip_app_build: true
